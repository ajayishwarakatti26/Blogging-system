<!--  header -->
<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport meta must remain in the head -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Django Blog</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom Blog CSS -->
    <link href="/static/css/blog.css" rel="stylesheet" />
    <style>
      /* moved inline background-image into local stylesheet to avoid inline styles */
      .featured-banner {
        background-image: url("/blogmain/static/images/cricket.jpg");
      }

      /* background for main container previously inline */
      .main-bg {
        background-image: url("/blogmain/static/images/cricket.jpg");
        background-blend-mode: overlay;
        background-size: cover;
      }
    </style>
  </head>

  <body>
    <!-- Header Navigation -->
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-4 pt-1">
            <a class="link-secondary" href="#">Subscribe</a>
          </div>
          <div class="col-4 text-center">
            <a
              class="blog-header-logo text-dark fs-2 text-decoration-none"
              href="#"
              >Django Blog</a
            >
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="link-secondary" href="#" aria-label="Search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                class="mx-3"
                viewBox="0 0 24 24"
              >
                <circle cx="10.5" cy="10.5" r="7.5" />
                <path d="M21 21l-5.2-5.2" />
              </svg>
            </a>
            <a class="btn btn-sm btn-outline-secondary mx-1" href="#">Log in</a>
            <a class="btn btn-sm btn-outline-primary" href="#">Register</a>
          </div>
        </div>
      </header>

      <!-- Category Navigation Bar -->
      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="p-2 link-secondary" href="#">{{ cat }}</a>
          {% endfor %}
        </nav>
      </div>
    </div>

    <!-- main content -->
     {% block content %}

     {% endblock %}

    <!-- Footer -->
    <footer class="blog-footer text-center py-4 bg-light">
      <p>
        Blog template built for Bootstrap by
        <a href="https://getbootstrap.com/">Bootstrap</a>.
      </p>
      <p><a href="#">Back to top</a></p>
    </footer>
  </body>
</html>
